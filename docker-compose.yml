# Phase 1 (safe): Laravel app + nginx in Docker.
# PostgreSQL stays on the host (existing live DB).
#
# Test:  http://SERVER_IP:8080
# Cutover to :80 only after smoke tests pass.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: mafunzo-app:latest
    container_name: mafunzo-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      # Reach host Postgres from containers (Linux Docker)
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      CACHE_CONFIG: ${CACHE_CONFIG:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - mafunzo

  nginx:
    image: nginx:1.27-alpine
    container_name: mafunzo-nginx
    restart: unless-stopped
    ports:
      # Keep host nginx on :80; test Docker on :8080 first
      - "${DOCKER_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      - app
    networks:
      - mafunzo

networks:
  mafunzo:
    driver: bridge
